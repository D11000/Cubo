
name: Gerar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar projeto Android
        run: |
          mkdir -p www && cp index.html www/
          npm install
          npx cap add android
          npx cap sync android
      - name: Ajustar tela cheia, horizontal e icone
        run: |
          R=android/app/src/main/res
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' $R/values/styles.xml
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            cp icon-$s.png $R/mipmap-$d/ic_launcher.png
            cp icon-$s.png $R/mipmap-$d/ic_launcher_round.png
          done
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SaltoCubo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Salto Cubo (versao ${{ github.run_number }})
          files: SaltoCubo.apk
